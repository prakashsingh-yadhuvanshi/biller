<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Biller - Mind Grace & Aasha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .clinic-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .clinic-btn {
            padding: 12px 30px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .clinic-btn:hover {
            background: white;
            color: #667eea;
        }

        .clinic-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .form-container {
            padding: 30px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo-section img {
            max-width: 200px;
            max-height: 100px;
            object-fit: contain;
        }

        .section-title {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: 600;
            border-left: 4px solid #667eea;
            padding-left: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .items-table th {
            background: #667eea;
            color: white;
            padding: 12px 8px;
            text-align: left;
            font-size: 14px;
        }

        .items-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .items-table input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-add-item {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-add-item:hover {
            background: #218838;
        }

        .btn-remove {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .totals-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .totals-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            min-width: 300px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .total-row.final {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            border-top: 2px solid #667eea;
            padding-top: 10px;
        }

        .payment-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .payment-methods {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                max-width: 100%;
            }

            .header,
            .clinic-selector,
            .btn-add-item,
            .btn-remove,
            .action-buttons {
                display: none !important;
            }

            .form-group input,
            .form-group select,
            .form-group textarea,
            .items-table input {
                border: none;
                background: transparent;
                padding: 5px 0;
            }

            .items-table {
                border: 1px solid #000;
            }

            .items-table th {
                background: #ccc !important;
                color: black !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .totals-box {
                background: white;
                border: 1px solid #000;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Clinic Billing System</h1>
            <p>Select your clinic to generate bill</p>
            <div class="clinic-selector">
                <button class="clinic-btn active" onclick="selectClinic('mindgrace')">Mind Grace Neuropsychiatric Clinic</button>
                <button class="clinic-btn" onclick="selectClinic('aasha')">Aasha Early Intervention Center</button>
            </div>
        </div>

        <div class="form-container">
            <!-- Logo Section -->
            <div class="logo-section" id="logoSection">
                <img src="" alt="Clinic Logo" id="clinicLogo">
            </div>

            <!-- Clinic Info -->
            <div class="form-grid">
                <div class="form-group">
                    <label>Clinic Name</label>
                    <input type="text" id="clinicName" readonly>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="clinicAddress" readonly>
                </div>
            </div>

            <!-- Receipt Info -->
            <div class="section-title">Receipt Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Receipt No</label>
                    <input type="text" id="receiptNo" placeholder="Enter receipt number">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="billDate">
                </div>
                <div class="form-group">
                    <label>Specialist's Name</label>
                    <input type="text" id="specialistName" placeholder="Dr. Name">
                </div>
            </div>

            <!-- Patient Info -->
            <div class="section-title">Patient Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text" id="patientName" placeholder="Enter patient name">
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="patientAge" placeholder="Age">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="patientGender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="patientContact" placeholder="Mobile number">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Address</label>
                    <textarea id="patientAddress" rows="2" placeholder="Patient address"></textarea>
                </div>
            </div>

            <!-- Items Table -->
            <div class="section-title">Services/Medicines</div>
            <table class="items-table" id="itemsTable">
                <thead>
                    <tr>
                        <th style="width: 5%;">S.No</th>
                        <th style="width: 35%;">Name of Medicine/Service</th>
                        <th style="width: 20%;">Batch No./Expiry</th>
                        <th style="width: 15%;">Rate (₹)</th>
                        <th style="width: 10%;">Qty</th>
                        <th style="width: 15%;">Cost (₹)</th>
                        <th style="width: 5%;" class="no-print"></th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                    <!-- Items will be added here -->
                </tbody>
            </table>
            <button class="btn-add-item no-print" onclick="addItem()">+ Add Item</button>

            <!-- Totals -->
            <div class="totals-section">
                <div class="totals-box">
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Discount (%):</span>
                        <span>
                            <input type="number" id="discountPercent" value="0" min="0" max="100" 
                                   onchange="calculateTotals()" style="width: 60px; padding: 5px;">
                        </span>
                    </div>
                    <div class="total-row">
                        <span>Discount Amount:</span>
                        <span id="discountAmount">₹0.00</span>
                    </div>
                    <div class="total-row">
                        <span>GST (18%):</span>
                        <span id="gstAmount">₹0.00</span>
                    </div>
                    <div class="total-row final">
                        <span>TOTAL:</span>
                        <span id="grandTotal">₹0.00</span>
                    </div>
                </div>
            </div>

            <!-- Payment Method -->
            <div class="payment-section">
                <div class="section-title" style="margin-bottom: 10px;">Mode of Payment</div>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="Cash" checked> Cash
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="PayTM"> PayTM
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="Bank Transfer"> Bank Transfer
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="Card"> Card
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMethod" value="UPI"> UPI
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons no-print">
                <button class="btn btn-primary" onclick="printBill()">🖨️ Print Bill</button>
                <button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script>
        // Clinic configurations
        const clinics = {
            mindgrace: {
                name: "MIND GRACE NEUROPSYCHIATRIC CLINIC",
                address: "J123, Gamma II, Greater Noida, Uttar Pradesh, 201310",
                logo: "img/MIND GRACE LOGO.jpg",
                specialist: "Dr. Anita Sharma"
            },
            aasha: {
                name: "AASHA EARLY INTERVENTION CENTER",
                address: "J123, Gamma II, Greater Noida, Uttar Pradesh, 201310",
                logo: "img/AASHA Logo.jpeg",
                specialist: ""
            }
        };

        let currentClinic = 'mindgrace';
        let itemCount = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            selectClinic('mindgrace');
            setTodayDate();
            addItem(); // Add first row by default
        });

        function selectClinic(clinic) {
            currentClinic = clinic;
            const config = clinics[clinic];
            
            // Update buttons
            document.querySelectorAll('.clinic-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update clinic info
            document.getElementById('clinicName').value = config.name;
            document.getElementById('clinicAddress').value = config.address;
            document.getElementById('specialistName').value = config.specialist;
            
            // Update logo
            const logoImg = document.getElementById('clinicLogo');
            logoImg.src = config.logo;
            logoImg.alt = config.name + ' Logo';
        }

        function setTodayDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('billDate').value = today;
        }

        function addItem() {
            itemCount++;
            const tbody = document.getElementById('itemsBody');
            const row = document.createElement('tr');
            row.id = `row-${itemCount}`;
            row.innerHTML = `
                <td>${itemCount}</td>
                <td><input type="text" placeholder="Medicine/Service name"></td>
                <td><input type="text" placeholder="Batch/Expiry"></td>
                <td><input type="number" class="rate" value="0" min="0" onchange="calculateRow(this)"></td>
                <td><input type="number" class="qty" value="1" min="1" onchange="calculateRow(this)"></td>
                <td><input type="number" class="cost" value="0" readonly></td>
                <td class="no-print"><button class="btn-remove" onclick="removeItem(${itemCount})">✕</button></td>
            `;
            tbody.appendChild(row);
        }

        function removeItem(rowId) {
            const row = document.getElementById(`row-${rowId}`);
            if (row) {
                row.remove();
                renumberRows();
                calculateTotals();
            }
        }

        function renumberRows() {
            const rows = document.querySelectorAll('#itemsBody tr');
            rows.forEach((row, index) => {
                row.cells[0].textContent = index + 1;
            });
        }

        function calculateRow(input) {
            const row = input.closest('tr');
            const rate = parseFloat(row.querySelector('.rate').value) || 0;
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const cost = rate * qty;
            row.querySelector('.cost').value = cost.toFixed(2);
            calculateTotals();
        }

        function calculateTotals() {
            let subtotal = 0;
            document.querySelectorAll('.cost').forEach(input => {
                subtotal += parseFloat(input.value) || 0;
            });

            const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
            const discountAmount = (subtotal * discountPercent) / 100;
            const afterDiscount = subtotal - discountAmount;
            const gst = afterDiscount * 0.18;
            const grandTotal = afterDiscount + gst;

            document.getElementById('subtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('discountAmount').textContent = `₹${discountAmount.toFixed(2)}`;
            document.getElementById('gstAmount').textContent = `₹${gst.toFixed(2)}`;
            document.getElementById('grandTotal').textContent = `₹${grandTotal.toFixed(2)}`;
        }

        function printBill() {
            window.print();
        }

        function resetForm() {
            if (confirm('Are you sure you want to reset the form?')) {
                document.getElementById('receiptNo').value = '';
                document.getElementById('specialistName').value = clinics[currentClinic].specialist;
                document.getElementById('patientName').value = '';
                document.getElementById('patientAge').value = '';
                document.getElementById('patientGender').value = '';
                document.getElementById('patientContact').value = '';
                document.getElementById('patientAddress').value = '';
                document.getElementById('discountPercent').value = 0;
                
                // Clear items and add one fresh row
                document.getElementById('itemsBody').innerHTML = '';
                itemCount = 0;
                addItem();
                
                calculateTotals();
                setTodayDate();
            }
        }
    </script>
</body>
</html>
