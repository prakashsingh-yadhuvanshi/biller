<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing System - Mind Grace & Aasha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Clinic Selection -->
        <div class="clinic-selector">
            <label for="clinicSelect">Select Clinic:</label>
            <select id="clinicSelect" onchange="switchClinic()">
                <option value="mindgrace">Mind Grace Neuropsychiatric Clinic</option>
                <option value="aasha">Aasha Early Intervention Center</option>
            </select>
        </div>

        <!-- Bill Container -->
        <div id="billContainer" class="bill-container">
            <!-- Header with Logo -->
            <div class="header">
                <img id="clinicLogo" src="img/MIND GRACE LOGO.jpg" alt="Clinic Logo" class="logo">
                <div class="clinic-info">
                    <h1 id="clinicName">MIND GRACE</h1>
                    <p id="clinicAddress">J123, Gamma II Greater Noida, Uttar Pradesh, 201310</p>
                </div>
            </div>

            <!-- Receipt Details -->
            <div class="receipt-details">
                <div class="row">
                    <div class="col">
                        <label>Date:</label>
                        <input type="date" id="billDate">
                    </div>
                    <div class="col">
                        <label>Receipt No:</label>
                        <input type="text" id="receiptNo" placeholder="Enter Receipt No">
                    </div>
                </div>
                <h2 class="receipt-title">Payment Receipt</h2>
            </div>

            <!-- Patient/Doctor Details -->
            <div class="patient-details">
                <div class="form-group">
                    <label>Specialist's Name:</label>
                    <input type="text" id="specialistName" value="Dr. Anita Sharma">
                </div>
                <div class="form-group">
                    <label>Patient Name:</label>
                    <input type="text" id="patientName" placeholder="Enter patient name">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Age:</label>
                        <input type="number" id="patientAge" placeholder="Age">
                    </div>
                    <div class="form-group">
                        <label>Gender:</label>
                        <select id="patientGender">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Contact:</label>
                        <input type="tel" id="patientContact" placeholder="Contact Number">
                    </div>
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" id="patientAddress" placeholder="Patient Address">
                </div>
            </div>

            <!-- Items Table -->
            <div class="items-section">
                <table id="itemsTable">
                    <thead>
                        <tr>
                            <th style="width: 5%;">S.No</th>
                            <th style="width: 30%;">Name of medicine / Service</th>
                            <th style="width: 15%;">Batch No./Expiry</th>
                            <th style="width: 10%;">Type</th>
                            <th style="width: 10%;">Rate</th>
                            <th style="width: 10%;">Qty</th>
                            <th style="width: 13%;">Cost</th>
                            <th style="width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <!-- Rows will be added dynamically -->
                    </tbody>
                </table>
                <button type="button" class="add-btn" onclick="addItemRow()">+ Add Item</button>
            </div>

            <!-- Totals Section -->
            <div class="totals-section">
                <div class="totals-row">
                    <label>Subtotal:</label>
                    <span id="subtotal">₹0.00</span>
                </div>
                <div class="totals-row discount-row" id="discountRow">
                    <label>
                        <input type="checkbox" id="discountToggle" onchange="toggleDiscountVisibility()"> Show Discount
                    </label>
                    <input type="number" id="discountPercent" value="0" min="0" max="100" onchange="calculateTotals()" onkeyup="calculateTotals()" style="width: 80px;" placeholder="%">
                    <span id="discountAmount"></span>
                </div>
                <div class="totals-row total">
                    <label>TOTAL:</label>
                    <span id="grandTotal">₹0.00</span>
                </div>
            </div>

            <!-- Payment Method -->
            <div class="payment-section">
                <label>Mode of Payment:</label>
                <div class="payment-options">
                    <label><input type="radio" name="paymentMethod" value="Cash"> Cash</label>
                    <label><input type="radio" name="paymentMethod" value="PayTm"> PayTm</label>
                    <label><input type="radio" name="paymentMethod" value="Bank Transfer"> Bank Transfer</label>
                    <label><input type="radio" name="paymentMethod" value="Card"> Card</label>
                </div>
            </div>

            <!-- Signature -->
            <div class="signature-section">
                <div class="signature-box">
                    <p>Signature (Stamp)</p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button type="button" class="btn btn-print" onclick="window.print()">Print Bill</button>
            <button type="button" class="btn btn-reset" onclick="resetForm()">Reset</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
